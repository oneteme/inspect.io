      <button type="button"
        class="home-button"
        (click)="goHome()"
      >
        <img class="header__home" src="assets/icons/house.svg" alt="home" />
      </button>
    </div>

  </div>

<!--  TODO : implémenter la recherche-->
  <button class="search-btn" (click)="openSearch()" title="Ctrl+K">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <span class="search-btn__label"> {{ "header.search" | translate }}</span>
    <kbd class="search-btn__kbd">Ctrl K</kbd>
  </button>



  <div class="header-actions">
    <button
      type="button"
      class="theme-button"
      [attr.aria-label]="'header.theme-toggle' | translate"
      [title]="'header.theme-toggle' | translate"
      (click)="themeService.toggleTheme()"
    >
      <!-- Sun icon when light -->
      <svg *ngIf="!isDark()" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <!-- Moon icon when dark -->
      <svg *ngIf="isDark()" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <button
      type="button"
      class="language-button"
      [attr.aria-label]="'header.language-tooltip' | translate"
      [title]="'header.language-tooltip' | translate"
      (click)="toggleLanguage()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm6.93 9h-3.14a15.7 15.7 0 0 0-1.19-4.34A8.03 8.03 0 0 1 18.93 11ZM12 4.07A13.7 13.7 0 0 1 13.74 11h-3.48A13.7 13.7 0 0 1 12 4.07ZM4.26 13h3.48A13.7 13.7 0 0 0 9.4 18.34A8.03 8.03 0 0 1 4.26 13ZM4.07 11a8.03 8.03 0 0 1 4.33-4.34A15.7 15.7 0 0 0 7.21 11Zm3.14 2h3.14A15.7 15.7 0 0 0 11.54 19.93 8.03 8.03 0 0 1 7.21 13Zm3.14-2h3.3A13.7 13.7 0 0 1 12 18a13.7 13.7 0 0 1-1.65-5Zm3.3 2h3.14a8.03 8.03 0 0 1-4.33 4.34A15.7 15.7 0 0 0 15.65 13Z"/>
      </svg>
      <span class="language-button__label">{{ currentLang().toUpperCase() }}</span>
    </button>

      type="button"
      class="social-links"

      <svg

    <!-- List of the github repositories linked to the project -->
    <div class="repo-menu">
      <button
      type="button"
      class="repo-menu-button"
      [class.is-open]="repoMenuOpen()"
      [attr.aria-expanded]="repoMenuOpen()"
      (click)="toggleMenu()"
      >
      <span>{{ "header.repo" | translate }}</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 10l5 5 5-5" />
      </svg>
      </button>

      <nav *ngIf="repoMenuOpen()" class="menu-panel" aria-label="Inspect menu">
      <a *ngFor="let item of menuItems; trackBy: trackByLabel" [href]="item.link" target="_blank" rel="noopener noreferrer" (click)="closeMenu()">
        {{ item.label }}
      </a>
      </nav>
    </div>
  </div>
</header>
